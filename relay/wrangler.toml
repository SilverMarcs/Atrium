name = "atrium-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "atrium-relay.lynksphere.com", custom_domain = true }]

# APNS_KEY_ID and APNS_PRIVATE_KEY (the .p8 file) are Worker secrets:
#   npx wrangler secret put APNS_KEY_ID
#   npx wrangler secret put APNS_PRIVATE_KEY < AuthKey_XXXXXXXXXX.p8
[vars]
APNS_TEAM_ID = "J52QUTREBS"
APNS_TOPIC = "com.SilverMarcs.Atrium"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
